name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out annotated release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require an annotated semantic-version tag
        run: |
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          version="${GITHUB_REF_NAME#v}"
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1])) process.exit(1)' "$version"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./packages/sdk/package.json").version')" = "$version"
          test "$(node -p 'require("./packages/contract-types/package.json").version')" = "$version"
          test "$(node -p 'require("./packages/reservation-react/package.json").version')" = "$version"
          test "$(node -p 'require("./packages/reservation-ui/package.json").version')" = "$version"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the repository release gate
        run: pnpm run ci:verify

      - name: Upload matching SDK release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdk-release-artifacts
          path: |
            dist-packages/reservation-platform-contract-types-*.tgz
            dist-packages/reservation-platform-sdk-*.tgz
            dist-packages/reservation-platform-react-*.tgz
            dist-packages/reservation-platform-ui-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Verify published-manifest and signature tooling
        run: node --test scripts/production/release-manifest.test.mjs scripts/production/verify-signatures.test.mjs

  build-and-sign:
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: api
            image: reservation-app-api
            dockerfile: Dockerfile
            target: runtime
          - component: worker
            image: reservation-app-worker
            dockerfile: Dockerfile
            target: worker-runtime
          - component: console
            image: reservation-app-console
            dockerfile: Dockerfile.web
            target: console-runtime
          - component: booking
            image: reservation-app-booking
            dockerfile: Dockerfile.web
            target: booking-runtime
          - component: tools
            image: reservation-app-tools
            dockerfile: Dockerfile.production-tools
            target: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image with attestations
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jericho0521/${{ matrix.image }}:${{ env.RELEASE_VERSION }}
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign the observed image digest
        env:
          IMAGE: ghcr.io/jericho0521/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Record observed digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > 'digest-${{ matrix.component }}.txt'

      - name: Upload observed digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: digest-${{ matrix.component }}.txt
          if-no-files-found: error
          retention-days: 7

  publish-bundle:
    needs: build-and-sign
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-release
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download observed image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: observed-digests

      - name: Download SDK release artifacts
        uses: actions/download-artifact@v4
        with:
          name: sdk-release-artifacts
          path: sdk-release-artifacts

      - name: Assemble validated release bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle="$RUNNER_TEMP/reservation-platform-$version"
          mkdir -p "$bundle/packages"
          cp --parents package.json compose.production.yml docker/production/Caddyfile docker/production/postgrest.conf docker/production/allowlists/api.env docker/production/allowlists/migrate.env docker/production/allowlists/worker.env scripts/production/install.sh scripts/production/preflight.sh scripts/production/release-manifest.mjs scripts/production/smoke.mjs scripts/production/support-bundle.sh scripts/production/support-bundle-sanitize.mjs "$bundle"
          cp release/README.md "$bundle/README.md"
          cp docs/THIRD_PARTY_NOTICES.md "$bundle/THIRD_PARTY_NOTICES.md"
          cp release/install.sh "$bundle/install.sh"
          cp scripts/production/verify-signatures.sh "$bundle/verify-signatures.sh"
          cp compose.production.yml "$bundle/compose.production.yml"
          cp docker/production/Caddyfile "$bundle/Caddyfile"
          cp "sdk-release-artifacts/reservation-platform-contract-types-$version.tgz" "$bundle/packages/"
          cp "sdk-release-artifacts/reservation-platform-sdk-$version.tgz" "$bundle/packages/"
          cp "sdk-release-artifacts/reservation-platform-react-$version.tgz" "$bundle/packages/"
          cp "sdk-release-artifacts/reservation-platform-ui-$version.tgz" "$bundle/packages/"
          chmod 0755 "$bundle/install.sh" "$bundle/verify-signatures.sh" "$bundle/scripts/production/install.sh" "$bundle/scripts/production/preflight.sh" "$bundle/scripts/production/support-bundle.sh"
          node -e 'const fs=require("node:fs");const out={};for(const file of fs.readdirSync("observed-digests")){const match=/^digest-(api|worker|console|booking|tools)\.txt$/.exec(file);if(match)out[match[1]]=fs.readFileSync(`observed-digests/${file}`,"utf8").trim()}fs.writeFileSync("observed-digests.json",JSON.stringify(out))'
          node scripts/production/release-manifest.mjs --generate-published --root "$bundle" --manifest "$bundle/release-manifest.json" --release "$version" --digests observed-digests.json --commit "$GITHUB_SHA" --required-migration 000040 --minimum-from-version 0.1.0 --rollback-compatible false --downgrade-compatible false
          node scripts/production/release-manifest.mjs --check-published --root "$bundle" --manifest "$bundle/release-manifest.json" --required-migration 000040
          (cd "$bundle" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C "$(dirname "$bundle")" -czf "reservation-platform-$version.tar.gz" "$(basename "$bundle")"
          sha256sum "reservation-platform-$version.tar.gz" > "reservation-platform-$version.tar.gz.sha256"

      - name: Upload immutable bundle for workflow inspection
        uses: actions/upload-artifact@v4
        with:
          name: reservation-platform-${{ github.ref_name }}
          path: |
            reservation-platform-*.tar.gz
            reservation-platform-*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            reservation-platform-*.tar.gz
            reservation-platform-*.tar.gz.sha256
