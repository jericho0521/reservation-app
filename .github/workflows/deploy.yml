name: Validate Published Self-Hosted Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected validation environment
        required: true
        type: choice
        options:
          - staging
          - production
      release_version:
        description: Exact published semantic version without the v prefix
        required: true
        type: string
      domain:
        description: Installation domain used to render the operator command
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-release-${{ inputs.environment }}-${{ inputs.release_version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'ci-placeholder-google-key' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'ci-placeholder-openrouter-key' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and operations tooling
        run: |
          pnpm run ci:verify
          pnpm run production:operations:test

  validate-published-release:
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate workflow inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          node -e 'if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/.test(process.env.RELEASE_VERSION)) process.exit(1)'
          node -e 'if (!/^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z][a-z0-9-]{0,62}$/.test(process.env.DOMAIN)) process.exit(1)'

      - name: Download the chosen published bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "reservation-platform-$RELEASE_VERSION.tar.gz" --pattern "reservation-platform-$RELEASE_VERSION.tar.gz.sha256"
          sha256sum -c "reservation-platform-$RELEASE_VERSION.tar.gz.sha256"
          mkdir extracted
          tar -xzf "reservation-platform-$RELEASE_VERSION.tar.gz" -C extracted
          echo "BUNDLE_ROOT=$PWD/extracted/reservation-platform-$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Verify bundle checksums, image signatures, provenance, and SBOMs
        run: |
          (cd "$BUNDLE_ROOT" && sha256sum -c SHA256SUMS)
          RELEASE_ROOT="$BUNDLE_ROOT" "$BUNDLE_ROOT/verify-signatures.sh" "$BUNDLE_ROOT/release-manifest.json"

      - name: Produce safe operator validation evidence
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          node -e 'const fs=require("node:fs");const manifest=JSON.parse(fs.readFileSync(`${process.env.BUNDLE_ROOT}/release-manifest.json`,"utf8"));const images=Object.fromEntries(Object.entries(manifest.images).map(([name,value])=>[name,value.digest]));fs.writeFileSync("release-validation.json",JSON.stringify({status:"verified",version:manifest.version,commit:manifest.commit,requiredMigration:manifest.requiredMigration,images},null,2)+"\n")'
          printf 'Validated release bundle: v%s\nOperator install command: sudo ./install.sh --domain %s\n' "$RELEASE_VERSION" "$DOMAIN" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ inputs.environment }}-${{ inputs.release_version }}
          path: release-validation.json
          if-no-files-found: error
