services:
  reservation-api:
    build:
      context: .
      target: runtime
    image: reservation-platform-backend:local
    ports:
      - "${PORT:-4100}:4100"
    environment:
      PORT: "4100"
      RESERVATION_SUPABASE_URL: "${RESERVATION_SUPABASE_URL}"
      RESERVATION_SUPABASE_ANON_KEY: "${RESERVATION_SUPABASE_ANON_KEY}"
      RESERVATION_SUPABASE_SERVICE_ROLE_KEY: "${RESERVATION_SUPABASE_SERVICE_ROLE_KEY}"
      RESERVATION_PLATFORM_SERVICE_API_KEY: "${RESERVATION_PLATFORM_SERVICE_API_KEY}"
      RESERVATION_PLATFORM_AUTH_JWKS_URL: "${RESERVATION_PLATFORM_AUTH_JWKS_URL}"
      RESERVATION_PLATFORM_AUTH_ISSUER: "${RESERVATION_PLATFORM_AUTH_ISSUER}"
      RESERVATION_PLATFORM_AUTH_AUDIENCE: "${RESERVATION_PLATFORM_AUTH_AUDIENCE}"
      RESERVATION_PLATFORM_AUTH_ALGORITHMS: "${RESERVATION_PLATFORM_AUTH_ALGORITHMS}"
      RESERVATION_PLATFORM_AUTH_CLOCK_TOLERANCE_SECONDS: "${RESERVATION_PLATFORM_AUTH_CLOCK_TOLERANCE_SECONDS}"
      RESERVATION_PLATFORM_AUTH_JWKS_CACHE_TTL_SECONDS: "${RESERVATION_PLATFORM_AUTH_JWKS_CACHE_TTL_SECONDS}"
      RESERVATION_PLATFORM_AUTH_SUBJECT_CLAIM: "${RESERVATION_PLATFORM_AUTH_SUBJECT_CLAIM}"
      RESERVATION_PLATFORM_AUTH_TENANT_IDS_CLAIM: "${RESERVATION_PLATFORM_AUTH_TENANT_IDS_CLAIM}"
      RESERVATION_PLATFORM_AUTH_VENUE_IDS_CLAIM: "${RESERVATION_PLATFORM_AUTH_VENUE_IDS_CLAIM}"
      RESERVATION_PLATFORM_AUTH_ROLES_CLAIM: "${RESERVATION_PLATFORM_AUTH_ROLES_CLAIM}"
      RESERVATION_PLATFORM_AUTH_SCOPES_CLAIM: "${RESERVATION_PLATFORM_AUTH_SCOPES_CLAIM}"
      RESERVATION_PLATFORM_CORS_ALLOWED_ORIGINS: "${RESERVATION_PLATFORM_CORS_ALLOWED_ORIGINS:-http://localhost:4000,http://127.0.0.1:4000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:4201,http://127.0.0.1:4201,http://localhost:4202,http://127.0.0.1:4202}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY}"
      GOOGLE_GENERATIVE_AI_MODEL: "${GOOGLE_GENERATIVE_AI_MODEL}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_CHAT_MODEL: "${OPENROUTER_CHAT_MODEL}"
      AI_AGENT_PROVIDER: "${AI_AGENT_PROVIDER}"
      AI_AGENT_BASE_URL: "${AI_AGENT_BASE_URL}"
      AI_AGENT_API_KEY: "${AI_AGENT_API_KEY}"
      AI_AGENT_MODEL: "${AI_AGENT_MODEL}"
      RESERVATION_WHATSAPP_ENABLED: "${RESERVATION_WHATSAPP_ENABLED:-false}"
      RESERVATION_WHATSAPP_PROVIDER: "${RESERVATION_WHATSAPP_PROVIDER:-session_qr}"
      RESERVATION_WHATSAPP_SESSION_AUTH_DIR: "${RESERVATION_WHATSAPP_SESSION_AUTH_DIR:-.reservation-whatsapp-sessions}"
      RESERVATION_WHATSAPP_SESSION_ENCRYPTION_KEY: "${RESERVATION_WHATSAPP_SESSION_ENCRYPTION_KEY}"
      RESERVATION_WHATSAPP_ALLOW_MEMORY_STORE: "${RESERVATION_WHATSAPP_ALLOW_MEMORY_STORE:-false}"
      RESERVATION_WHATSAPP_SIMULATION_ENABLED: "${RESERVATION_WHATSAPP_SIMULATION_ENABLED:-false}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
